# 벤더를 어떻게 부르는지만 둔다: 모델 ID, CLI 플래그, 승격 순서, 대체 모델, 한도 초과 문구.
# 무엇을 얼마나 부를지(단계별 배정, 호출 상한)는 실행 명세 00_spec.md에만 있다. 모델 버전 문자열은 aliases에서만 바꾼다.
# cmd 자리표시자: {model} {effort} {out}. full_flags는 코드 수정 단계, readonly_flags는 조사·비평·감사 단계에 붙는다.
# 2026-11-19 서버 실측: 아래 8개 ID 모두 "reply ok" 응답 확인. agy는 stdin을 읽지 않아 -p=<프롬프트> 인자로 넘긴다.
# session: 여러 번 주고받는 단계(아이디어 토론)에서 앞 대화를 이어 쓰는 방법. new는 첫 호출, resume은 다음 호출에 붙고
# {session}이 세션 번호로 바뀐다. id는 세션 번호를 얻는 곳: uuid(제어기가 정해 넘김), jsonl(codex 이벤트의 thread_id),
# json(agy 출력의 conversation_id). 2026-11-19 세 CLI 모두 두 번째 호출이 첫 호출 내용을 기억하는 것을 확인했다.
# search: 트랙 A·C의 선행연구 교차 조사에서 이 벤더가 조사자로 나설 때 쓰는 모델. 기본은 search가 있는 벤더 셋이
# 모두 따로 조사한다(명세에서 바꿀 일은 거의 없다). 2026-11-19 세 CLI 모두 읽기 전용 호출에서 웹 검색이 되는 것을
# 확인했다(학습 시점 뒤의 arXiv 논문 제목을 셋 다 맞힘. codex는 따로 켜지 않아도 검색한다).

vendors:
  claude:
    aliases: {sonnet: "sonnet", opus: "opus", fable: "fable"}
    efforts: [low, medium, high, xhigh, max]
    cmd: ["claude", "-p", "--model", "{model}", "--effort", "{effort}", "--output-format", "text"]
    full_flags: ["--dangerously-skip-permissions"]
    readonly_flags: ["--permission-mode", "dontAsk", "--allowedTools", "Read,Grep,Glob,WebSearch,WebFetch"]
    prompt_via: stdin
    session: {id: uuid, new: ["--session-id", "{session}"], resume: ["--resume", "{session}"]}
    search: {model: fable, effort: medium}
    escalation_ladder:                            # opus max는 fable high보다 느리고 약해 사다리에서 뺐다
      - {model: opus, effort: high}
      - {model: opus, effort: xhigh}
      - {model: fable, effort: high}
    fallback_on_quota: {provider: agy, model: neon, effort: xhigh}

  agy:
    aliases: {neon: "gemini-4-neon"}            # 평소 medium, 핵심 단계 high·xhigh
    efforts: [low, medium, high, xhigh]
    cmd: ["agy", "--model", "{model}-{effort}"]  # ID에 추론 단계가 붙은 형식 (gemini-4-neon-high)
    full_flags: ["--dangerously-skip-permissions"]
    # --sandbox만으로는 파일 쓰기가 막히지 않고, 승인이 필요한 명령을 만나면 빈 답으로 끝난다. 명령과 쓰기를 거부 규칙으로 막는다
    readonly_flags: ["--sandbox", "--settings", '{"permissions":{"deny":["command(*)","write_file(*)"]}}']
    prompt_via: arg
    prompt_arg: "-p={prompt}"
    session: {id: json, new: ["--output-format", "json"], resume: ["--output-format", "json", "--conversation", "{session}"]}
    search: {model: neon, effort: high}
    escalation_ladder:
      - {model: neon, effort: medium}
      - {model: neon, effort: high}
      - {model: neon, effort: xhigh}
    fallback_on_quota: {provider: claude, model: opus, effort: xhigh}

  codex:
    aliases: {sol: "gpt-6.2-sol", astra: "gpt-6.2-astra"}
    efforts: [minimal, low, medium, high, xhigh, max]
    cmd: ["codex", "exec", "--skip-git-repo-check", "-m", "{model}", "-c", "model_reasoning_effort={effort}", "-o", "{out}"]
    full_flags: ["--dangerously-bypass-approvals-and-sandbox"]
    readonly_flags: ["-s", "read-only"]
    prompt_via: stdin
    tail: ["-"]                                   # "-" = stdin에서 지시문 읽기
    output: file                                  # 마지막 메시지가 -o 파일로 나온다
    session:
      id: jsonl
      new: ["--json"]
      resume: ["--json", "{session}"]
      resume_cmd: ["codex", "exec", "resume", "--skip-git-repo-check", "-m", "{model}", "-c", "model_reasoning_effort={effort}", "-o", "{out}"]
      resume_readonly_flags: ["-c", "sandbox_mode=read-only"]   # resume은 -s를 받지 않는다
    search: {model: sol, effort: high}
    escalation_ladder:
      - {model: sol, effort: medium}
      - {model: sol, effort: high}
      - {model: astra, effort: high}
    fallback_on_quota: {provider: agy, model: neon, effort: high}

# 비정상 종료 출력에 이 문자열이 있으면 한도 초과로 보고 그 모델을 이번 실행에서 뺀다 (같은 벤더의 다른 모델은 계속 쓴다).
quota_patterns: ["rate limit", "rate_limit", "usage limit", "quota", "too many requests", "429", "limit reached"]

push:
  max_file_mb: 50
